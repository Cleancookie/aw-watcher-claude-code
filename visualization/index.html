<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Code</title>
<style>
  :root { --fg: #212529; --muted: #6c757d; --line: #dee2e6; --accent: #007bff; --none: rgb(204, 204, 204); }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow: hidden; background: transparent; }
  body { font: 14px/1.3 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--fg); }
  nav { display: flex; gap: 14px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  nav button { border: 0; background: none; padding: 4px 0 6px; font: inherit; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  nav button[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .crumbs { font-size: 12px; margin-bottom: 4px; color: var(--muted); }
  .crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .crumbs a:hover { text-decoration: underline; }
  .total { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .row.drill { cursor: pointer; }
  .row.drill:hover .bar { filter: brightness(.92); }
  .row { position: relative; height: 46px; margin-bottom: 5px; }
  .row .bar { position: absolute; inset: 0 auto 0 0; min-width: 4px; border-radius: 5px; }
  .row .text { position: relative; padding: 6px 5px 0; white-space: nowrap; font-family: sans-serif; }
  .row .label { font-size: 14px; line-height: 16px; color: #333; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { font-size: 11px; line-height: 13px; color: #444; margin-top: 4px; }
  .more { display: inline-flex; align-items: center; gap: 2px; margin-top: 4px; padding: .25rem .5rem; font: inherit; font-size: .875rem; line-height: 1.5;
          color: var(--muted); background: transparent; border: 1px solid var(--muted); border-radius: .2rem; cursor: pointer; }
  .more:hover { color: #fff; background: var(--muted); }
  .more svg { fill: currentColor; }
  .empty { color: var(--muted); font-size: 18px; }
</style>
</head>
<body>
<nav>
  <button data-tab="ticket" aria-pressed="true">Tickets</button>
  <button data-tab="project">Projects</button>
  <button data-tab="session">Sessions</button>
  <button data-tab="model">Models</button>
</nav>
<div class="crumbs" id="crumbs"></div>
<div class="total" id="total"></div>
<div id="list"><span class="empty">Loading…</span></div>
<script>
const params = new URLSearchParams(location.search);
const host = params.get("hostname");
const timeperiod = `${params.get("start")}/${params.get("end")}`;
const query = [`RETURN = query_bucket(find_bucket("aw-watcher-claude-code_", "${host}"));`];

const PALETTE = ["rgb(174, 161, 255)", "rgb(115, 216, 255)", "rgb(104, 188, 0)", "rgb(255, 184, 92)", "rgb(255, 140, 170)", "rgb(80, 210, 180)"];
const CHEVRON = '<svg aria-hidden="true" width="10" height="16" viewBox="0 0 320 512"><path d="M143 256.3l-136-136c-9.4-9.4-9.4-24.6 0-33.9l22.6-22.6c9.4-9.4 24.6-9.4 33.9 0l96.4 96.4 96.4-96.4c9.4-9.4 24.6-9.4 33.9 0l22.8 22.5c9.4 9.4 9.4 24.5 0 33.9l-136 136c-9.4 9.5-24.6 9.5-34 0.1zM177 448.3c-9.4 9.4-24.6 9.4-34-0.1l-136-136c-9.4-9.3-9.4-24.5 0-33.9l22.7-22.6c9.3-9.4 24.5-9.4 33.9 0l96.4 96.4 96.5-96.3c9.3-9.4 24.5-9.4 33.9 0l22.6 22.6c9.4 9.3 9.4 24.5 0 33.9z"/></svg>';
const PAGE = 5;

const hhmm = t => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

const groups = {
  ticket: ({ data: d }) => [d.ticket, ""],
  project: ({ data: d }) => [d.project, ""],
  session: ({ data: d }) => [d.title ?? d.session_id.slice(0, 8), [d.ticket, d.project].filter(Boolean).join(" · ")],
  model: ({ data: d }) => [d.model, d.effort ? `${d.effort} effort` : ""],
  event: e => [`${hhmm(e.timestamp)}–${hhmm(Date.parse(e.timestamp) + e.duration * 1000)}`, [e.data.model, e.data.effort].filter(Boolean).join(" ")],
};
const fallback = { ticket: "No ticket", project: "Unknown", session: "", model: "Unknown" };
const drillTo = { ticket: "session", project: "ticket", model: "session", session: "event" };

let events = [];
let tab = "ticket";
let shown = PAGE;
let filters = [];

const keyOf = (key, e) => {
  const [raw, sub] = groups[key](e);
  return [raw ?? fallback[key], sub];
};
const idOf = (key, e) => (key === "event" ? e.id : keyOf(key, e).join("\0"));
const filtered = () => events.filter(e => filters.every(f => idOf(f.key, e) === f.id));

// Same-origin iframe: borrow AW's font and size the iframe to fit, since AW leaves it at 300×150.
try { document.body.style.fontFamily = parent.getComputedStyle(parent.document.body).fontFamily; } catch {}
function fit() {
  const frame = window.frameElement;
  if (!frame) return;
  Object.assign(frame.style, { width: "100%", border: "0", display: "block" });
  frame.style.height = document.documentElement.scrollHeight + "px";
}

const color = label => {
  let h = 0;
  for (const c of label) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
};

const fmt = s => {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}h ${m}m` : m ? `${m}m ${Math.floor(s % 60)}s` : `${Math.floor(s)}s`;
};

// merge_events_by_keys only sums duration, so grouping happens here to sum cost too.
function group(key) {
  const rows = new Map();
  for (const e of filtered()) {
    const [label, sub] = keyOf(key, e);
    const id = idOf(key, e);
    const row = rows.get(id) ?? { id, label, sub, none: groups[key](e)[0] == null, start: e.timestamp, duration: 0, cost: 0 };
    row.duration += e.duration;
    row.cost += e.data.cost_usd ?? 0;
    rows.set(id, row);
  }
  const order = key === "event" ? (a, b) => a.start.localeCompare(b.start) : (a, b) => b.duration - a.duration;
  return [...rows.values()].sort(order);
}

function drill(row) {
  filters.push({ key: tab, id: row.id, label: row.label, from: tab });
  setTab(drillTo[tab]);
}

function drawCrumbs() {
  const crumbs = document.getElementById("crumbs");
  if (!filters.length) return crumbs.replaceChildren();
  const link = (text, depth) => {
    const a = document.createElement("a");
    a.textContent = text;
    a.onclick = () => { const from = filters[depth]?.from; filters = filters.slice(0, depth); setTab(from ?? tab); };
    return a;
  };
  crumbs.replaceChildren(link("All", 0), ...filters.flatMap((f, i) =>
    [" › ", i === filters.length - 1 ? f.label : link(f.label, i + 1)]));
}

function setTab(next) {
  tab = next;
  shown = PAGE;
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-pressed", x.dataset.tab === tab));
  draw();
}

function draw() {
  drawCrumbs();
  const rows = group(tab);
  const list = document.getElementById("list");
  const total = rows.reduce((t, r) => ({ duration: t.duration + r.duration, cost: t.cost + r.cost }), { duration: 0, cost: 0 });
  document.getElementById("total").textContent = rows.length ? `Total ${fmt(total.duration)} · ≈$${total.cost.toFixed(2)}` : "";

  if (!rows.length) {
    list.innerHTML = '<span class="empty">No data</span>';
    return fit();
  }

  const max = rows[0].duration || 1;
  list.replaceChildren(...rows.slice(0, shown).map(r => {
    const row = document.createElement("div");
    row.className = drillTo[tab] ? "row drill" : "row";
    if (drillTo[tab]) row.onclick = () => drill(r);
    row.title = [r.label, r.sub].filter(Boolean).join("\n");
    row.innerHTML = '<div class="bar"></div><div class="text"><div class="label"></div><div class="sub"></div></div>';
    Object.assign(row.querySelector(".bar").style, {
      width: `${Math.max((r.duration / max) * 100, 1)}%`,
      background: r.none ? "var(--none)" : color(r.label),
    });
    row.querySelector(".label").textContent = r.label;
    row.querySelector(".sub").textContent = [fmt(r.duration), `≈$${r.cost.toFixed(2)}`, r.sub].filter(Boolean).join(" · ");
    return row;
  }));

  if (rows.length > shown) {
    const more = document.createElement("button");
    more.className = "more";
    more.innerHTML = `${CHEVRON}Show more`;
    more.onclick = () => { shown += PAGE; draw(); };
    list.append(more);
  }
  fit();
}

document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

fetch("/api/0/query/", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ timeperiods: [timeperiod], query }),
})
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(([result]) => { events = result; draw(); })
  .catch(() => { document.getElementById("list").innerHTML = '<span class="empty">No data</span>'; fit(); });
</script>
</body>
</html>
